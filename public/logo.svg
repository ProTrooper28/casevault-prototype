<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cvShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E5FBF"/>
      <stop offset="0.55" stop-color="#12408F"/>
      <stop offset="1" stop-color="#0C2D6B"/>
    </linearGradient>
    <linearGradient id="cvFolder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D77D4"/>
      <stop offset="1" stop-color="#17497F"/>
    </linearGradient>
    <linearGradient id="cvPaper" x1="0" y1="0" x2="0" y2="1">
